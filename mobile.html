<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151521">
<title>Young Vic | Building Sign In</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#171723}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(180deg,rgba(9,9,20,.32),rgba(9,9,20,.78)),url('mobile-background.jpg') center/cover fixed}main{max-width:480px;margin:auto;padding:38px 22px 55px}.logo{display:block;width:min(270px,76%);height:auto;margin:0 auto 22px}h1{font-size:clamp(27px,7vw,36px);margin:10px 0 5px;line-height:1.1}p{color:#ececf2;line-height:1.5}.sub{margin:0 0 24px}.card{background:linear-gradient(145deg,rgba(38,34,52,.57),rgba(19,20,39,.48));border:1px solid rgba(255,255,255,.13);border-radius:30px;padding:25px 22px;box-shadow:0 20px 65px rgba(5,5,16,.17);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}label.field{display:block;font-weight:650;margin:17px 0 7px}input[type=text],select{width:100%;border:1px solid rgba(255,255,255,.23);border-radius:15px;background:rgba(255,255,255,.90);color:#242232;padding:14px;font-size:16px;min-height:50px}input:focus,select:focus,button:focus-visible{outline:3px solid #fffb66;outline-offset:3px}.check{display:flex;align-items:flex-start;gap:12px;margin:22px 0 7px;font-size:15px;line-height:1.4}.check input{width:22px;height:22px;flex:none;accent-color:#ffff69}.muted{font-size:13px;color:#e2e2e8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}button{border:0;border-radius:17px;padding:16px 12px;font-size:17px;font-weight:800;cursor:pointer}.in{background:#a5dfb0;color:#173521}.out{background:#eab0b9;color:#49202a}.secondary{background:transparent;color:#fff;text-decoration:underline;font-size:14px;padding:10px 4px}.utility{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:13px}.status{border-radius:12px;padding:12px 14px;margin-top:18px;background:rgba(255,251,105,.16);border:1px solid #fffb69;font-size:14px;line-height:1.45}.hidden{display:none}.pilot{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#ffff69}footer{text-align:center;font-size:12px;color:#ddd;margin:20px auto 0;line-height:1.5}@media(max-width:360px){.actions{grid-template-columns:1fr}} 
</style>
</head>
<body><main>
<img class="logo" src="mobile-logo.png" alt="Young Vic">
<div class="card"><div class="pilot">Development preview · Not connected</div>
<h1>Building sign in</h1><p class="sub">Welcome to the Young Vic. Save your details on this phone to make future visits quicker.</p>
<form id="details" autocomplete="on">
<label class="field" for="fullName">Full name</label><input id="fullName" name="name" type="text" autocomplete="name" maxlength="120" required placeholder="Your full name">
<label class="field" for="department">Department</label><select id="department" name="department" required><option value="">Select a department</option><option>Production</option><option>Operations</option><option>Box Office</option><option>Technical / Production</option><option>Stage Management</option><option>Creative / Visiting Company</option><option>Development</option><option>Marketing</option><option>Administration</option><option>Freelance / Contractor</option><option>Visitor</option><option>Other</option></select>
<label class="field" for="visiting">Who are you visiting? <span class="muted">(optional)</span></label><input id="visiting" name="visiting" type="text" maxlength="120" placeholder="Name or team">
<label class="check"><input id="remember" type="checkbox"><span><strong>Remember my details on this phone</strong><br><span class="muted">Only choose this on your own device. You can forget them at any time.</span></span></label>
<div class="actions"><button class="in" type="button" data-action="in">SIGN IN</button><button class="out" type="button" data-action="out">SIGN OUT</button></div>
<div class="utility"><button class="secondary" type="button" id="forget">Forget my details</button><button class="secondary" type="button" id="clear">Clear fields</button></div>
<div id="status" class="status hidden" role="status" aria-live="polite"></div>
</form></div><footer>Preview only. No attendance records are submitted or updated.<br>Continue using the existing Microsoft Forms for real sign-ins.</footer>
</main>
<script>
(()=>{'use strict';const key='youngVicRememberMeV1';const ids=['fullName','department','visiting'];const fields=ids.map(id=>document.getElementById(id));const remember=document.getElementById('remember');const status=document.getElementById('status');function show(message){status.textContent=message;status.classList.remove('hidden')}function hide(){status.classList.add('hidden');status.textContent=''}function clearSaved(){try{localStorage.removeItem(key)}catch(e){}}function save(){if(!remember.checked){clearSaved();return}const data=Object.fromEntries(ids.map((id,i)=>[id,fields[i].value.trim()]));try{localStorage.setItem(key,JSON.stringify(data))}catch(e){show('Your browser could not save details on this device.')}}try{const stored=JSON.parse(localStorage.getItem(key)||'null');if(stored&&typeof stored==='object'){ids.forEach((id,i)=>{if(typeof stored[id]==='string')fields[i].value=stored[id]});remember.checked=true}}catch(e){clearSaved()}fields.forEach(f=>f.addEventListener('input',()=>{hide();if(remember.checked)save()}));remember.addEventListener('change',()=>{hide();save();if(remember.checked)show('Remember Me is switched on for this browser. Your details will be saved on this device.');else show('Saved details have been removed from this browser.')});document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{hide();if(!document.getElementById('details').reportValidity())return;save();const action=button.dataset.action==='in'?'sign in':'sign out';show('Preview only: your details '+(remember.checked?'have been saved on this phone':'have not been saved')+'. This did NOT '+action+' you in the building register. Please use the existing Microsoft Form for a real '+action+'.')}));document.getElementById('forget').addEventListener('click',()=>{clearSaved();remember.checked=false;fields.forEach(f=>f.value='');show('Saved details removed and fields cleared.')});document.getElementById('clear').addEventListener('click',()=>{fields.forEach(f=>f.value='');remember.checked=false;clearSaved();show('Fields cleared. Saved details on this phone have also been removed.')});})();
</script>
</body></html>

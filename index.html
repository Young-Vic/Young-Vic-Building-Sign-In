<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="robots" content="noindex, nofollow">
  <title>Young Vic | Building Sign In & Out</title>
  <style>
    :root {font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; color:#292b2b; background:#f7f6f2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,50px)}
    main{width:min(1100px,100%);text-align:center}
    .logo{display:block;width:min(250px,45vw);max-height:120px;object-fit:contain;margin:0 auto 22px}
    h1{font-size:clamp(26px,4vw,49px);margin:0 0 10px;letter-spacing:-.035em}
    .intro{font-size:clamp(16px,1.8vw,21px);color:#606463;margin:0 auto 32px;line-height:1.45}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,3vw,30px)}
    .action{min-height:clamp(150px,25vh,230px);border-radius:24px;color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-decoration:none;box-shadow:0 6px 18px #00000012;transition:filter .15s}
    .action:focus-visible{outline:5px solid #222;outline-offset:5px}
    .action:active{filter:brightness(.88)}
    .in{background:#62866e}.out{background:#bb514d}
    .action strong{font-size:clamp(32px,5vw,62px);letter-spacing:-.035em}
    .action span{font-size:clamp(15px,1.8vw,20px)}
    footer{margin-top:26px;color:#6d7270;font-size:14px}
    @media(max-width:580px){.actions{grid-template-columns:1fr}.action{min-height:130px}.logo{width:170px}}
    @media(max-height:600px) and (min-width:581px){body{padding:12px 30px}.logo{width:160px;max-height:70px;margin-bottom:8px}h1{font-size:30px}.intro{margin-bottom:15px}.action{min-height:145px}footer{margin-top:12px}}
  </style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Young Vic" />
  <h1>Welcome to the Young Vic</h1>
  <p class="intro">Please sign in when you arrive and sign out when you leave.</p>
  <nav class="actions" aria-label="Building access">
    <a class="action in" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=A-5VuLENQEWT9dpwaryP7JI35kObbvxGmH32G6NbJkJUMzhZNVhOQUFUNzk5OEJBU1hUNVM0WFg0Qy4u"><strong>SIGN IN</strong><span>I'm arriving</span></a>
    <a class="action out" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=A-5VuLENQEWT9dpwaryP7JI35kObbvxGmH32G6NbJkJUQURKNEExWk5RQ0QzUDdOS1hURUdWTkNHWS4u"><strong>SIGN OUT</strong><span>I'm leaving</span></a>
  </nav>
  <footer>Thank you for signing in and out.</footer>
</main>
</body>
</html>
